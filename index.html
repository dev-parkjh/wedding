<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>모바일 청첩장 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f7f2eb;
      color: #312820;
      font: 1rem/1.65 system-ui, sans-serif;
    }
    main { width: min(100%, 28rem); text-align: center; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 6vw, 2.5rem); }
    p { margin: 0; color: #65564a; }
  </style>
</head>
<body>
  <main>
    <h1>모바일 청첩장 테스트</h1>
    <p>청첩장 주소 연결을 확인하는 페이지입니다.</p>
  </main>
</body>
</html>
